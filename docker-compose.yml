services:
  dashboard:
    build: .
    # Both values are read from .env so a second instance (another domain,
    # its own checkout directory) can run beside the first on the same host.
    # The defaults are the original single-instance values.
    container_name: ${CONTAINER_NAME:-listmonk-pro}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DATA_DIR=/data
    volumes:
      - listmonk-pro-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  listmonk-pro-data:
