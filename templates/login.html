<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ListMonk Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="alternate icon" type="image/png" href="/static/favicon.png">
    <style>
        :root {
            /* Brand & Accent Tokens from DESIGN.md */
            --primary: #533afd;
            --primary-deep: #4434d4;
            --primary-press: #2e2b8c;
            --primary-soft: #665efd;
            --primary-glow: rgba(83, 58, 253, 0.35);
            --primary-subdued: rgba(83, 58, 253, 0.12);
            --brand-dark-900: #1c1e54;
            --ink: #0d253d;
            --ink-secondary: #273951;
            --ink-mute: #64748d;
            --ruby: #ea2261;
            --ruby-glow: rgba(234, 34, 97, 0.2);
            --magenta: #f96bee;
            --emerald: #10b981;

            /* Dark Theme Tokens (Default) */
            color-scheme: dark;
            --bg-canvas: #080c15;
            --glass-bg: rgba(15, 23, 42, 0.68);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-border-focus: rgba(83, 58, 253, 0.6);
            --glass-highlight: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 20px 50px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.06);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            /* #64748b fell below the 4.5:1 WCAG AA threshold on the input
               background; this lifts it while keeping the same visual weight. */
            --text-muted: #7c8ba1;
            --input-bg: rgba(11, 18, 33, 0.75);
            --input-border: rgba(255, 255, 255, 0.12);
        }

        [data-theme="light"] {
            color-scheme: light;
            --bg-canvas: #f6f9fc;
            --glass-bg: rgba(255, 255, 255, 0.82);
            --glass-border: rgba(227, 232, 238, 0.9);
            --glass-border-focus: rgba(83, 58, 253, 0.6);
            --glass-highlight: rgba(255, 255, 255, 0.9);
            --glass-shadow: 0 20px 50px rgba(0, 55, 112, 0.1), 0 1px 3px rgba(0, 55, 112, 0.05);
            --text-primary: #0d253d;
            --text-secondary: #273951;
            --text-muted: #64748d;
            --input-bg: rgba(255, 255, 255, 0.95);
            --input-border: rgba(168, 195, 222, 0.7);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-canvas);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
            position: relative;
            font-feature-settings: "ss01", "cv02", "cv03", "cv04";
        }

        /* ── Atmospheric Gradient Mesh Backdrop ─────────────────── */
        .ambient-mesh {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .ambient-mesh .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.55;
            animation: orbFloat 18s ease-in-out infinite alternate;
        }

        [data-theme="light"] .ambient-mesh .orb {
            opacity: 0.45;
            filter: blur(80px);
        }

        .orb-1 {
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, #533afd 0%, rgba(83, 58, 253, 0) 70%);
            top: -100px;
            left: 10%;
            animation-duration: 22s;
        }

        .orb-2 {
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, #ea2261 0%, rgba(234, 34, 97, 0) 70%);
            bottom: -80px;
            right: 15%;
            animation-duration: 26s;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #f96bee 0%, rgba(249, 107, 238, 0) 70%);
            top: 40%;
            left: 55%;
            animation-duration: 20s;
            animation-delay: -10s;
        }

        .orb-4 {
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, #9b6829 0%, rgba(155, 104, 41, 0) 70%);
            top: 20%;
            right: 5%;
            opacity: 0.35;
            animation-duration: 24s;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, -30px) scale(1.08); }
            100% { transform: translate(-30px, 40px) scale(0.95); }
        }

        /* ── Glassmorphic Login Card ────────────────────────────── */
        .login-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 430px;
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(190%);
            -webkit-backdrop-filter: blur(24px) saturate(190%);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 44px 36px 36px;
            box-shadow: var(--glass-shadow);
            animation: cardAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Inner specular highlight line */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 20px;
            right: 20px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--glass-highlight), transparent);
            pointer-events: none;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ── Header & Logo ──────────────────────────────────────── */
        .brand-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            text-decoration: none;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-soft) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            box-shadow: 0 4px 16px var(--primary-glow);
        }

        .logo-icon svg {
            width: 22px;
            height: 22px;
        }

        .logo-text {
            font-family: 'Outfit', sans-serif;
            font-size: 1.65rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--text-primary);
        }

        .logo-text span {
            background: linear-gradient(135deg, var(--primary) 0%, var(--magenta) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-pill {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 3px 8px;
            border-radius: 9999px;
            background: var(--primary-subdued);
            color: var(--primary-soft);
            border: 1px solid rgba(83, 58, 253, 0.25);
            margin-left: 2px;
        }

        .subtitle {
            font-size: 0.92rem;
            color: var(--text-secondary);
            font-weight: 400;
            letter-spacing: -0.01em;
        }

        /* ── Error Banner ───────────────────────────────────────── */
        .error-banner {
            background: rgba(234, 34, 97, 0.12);
            border: 1px solid rgba(234, 34, 97, 0.35);
            color: #ff5c8a;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.88rem;
            margin-bottom: 24px;
            display: none;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(8px);
        }

        [data-theme="light"] .error-banner {
            background: rgba(234, 34, 97, 0.08);
            color: #d1124d;
        }

        .error-banner svg {
            flex-shrink: 0;
            width: 18px;
            height: 18px;
        }

        /* ── Form Controls ──────────────────────────────────────── */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.84rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            letter-spacing: -0.01em;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            width: 18px;
            height: 18px;
            color: var(--text-muted);
            pointer-events: none;
            transition: color 0.15s ease;
            /* The input below paints a backdrop-filter, which forces it into its
               own stacking layer and composites whatever is behind it — including
               this icon — so without a z-index the icon gets blurred away. */
            z-index: 1;
        }

        input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(8px);
        }

        input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
            background: var(--input-bg);
        }

        input:focus + .input-icon,
        .input-wrap:focus-within .input-icon {
            color: var(--primary-soft);
        }

        /* ── Submit Pill Button (from DESIGN.md) ─────────────────── */
        .btn-submit {
            width: 100%;
            margin-top: 10px;
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-deep) 100%);
            border: none;
            border-radius: 9999px;
            color: #ffffff;
            font-size: 0.96rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 20px var(--primary-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, var(--primary-soft) 0%, var(--primary) 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(83, 58, 253, 0.5);
        }

        .btn-submit:active {
            background: var(--primary-press);
            transform: translateY(0);
            box-shadow: 0 2px 10px var(--primary-glow);
        }

        /* ── Footer & Credits ───────────────────────────────────── */
        .card-footer {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .card-footer a {
            color: var(--primary-soft);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.15s;
        }

        .card-footer a:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        .theme-toggle-btn {
            background: none;
            border: 1px solid var(--glass-border);
            border-radius: 9999px;
            padding: 6px 12px;
            color: var(--text-secondary);
            font-size: 0.78rem;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
            backdrop-filter: blur(6px);
        }

        .theme-toggle-btn:hover {
            background: var(--primary-subdued);
            border-color: var(--primary);
            color: var(--text-primary);
        }

        .theme-toggle-btn svg {
            width: 14px;
            height: 14px;
        }
    </style>
    <script>
        (function() {
            var t = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>
<body>
    <!-- Ambient Gradient Mesh -->
    <div class="ambient-mesh">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="orb orb-4"></div>
    </div>

    <div class="login-card">
        <div class="brand-header">
            <div class="logo-badge">
                <div class="logo-text">ListMonk<span>Pro</span><span class="logo-pill">v2.0</span></div>
            </div>
            <div class="subtitle">Sign in to your administration dashboard</div>
        </div>

        <div class="error-banner" id="error">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span id="errorText">Invalid username or password</span>
        </div>

        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <input type="text" id="username" name="username" placeholder="admin" autocomplete="username" required autofocus>
                </div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
                </div>
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">
                <span>Sign In</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </button>
        </form>

        <div class="card-footer">
            <button class="theme-toggle-btn" onclick="toggleTheme()" type="button" id="themeBtn">
                <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                <span id="themeLabel">Theme</span>
            </button>
            <div>
                Crafted by <a href="https://worthmind.net/" target="_blank" rel="noopener">WorthMind</a>
            </div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'dark';
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error');
            const errorText = document.getElementById('errorText');
            const submitBtn = document.getElementById('submitBtn');

            errorEl.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.7';

            try {
                const resp = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });

                if (resp.ok) {
                    window.location.href = '/';
                } else {
                    const data = await resp.json();
                    errorText.textContent = data.detail || 'Invalid credentials';
                    errorEl.style.display = 'flex';
                }
            } catch {
                errorText.textContent = 'Connection error. Please verify server status.';
                errorEl.style.display = 'flex';
            } finally {
                submitBtn.disabled = false;
                submitBtn.style.opacity = '1';
            }
            return false;
        }
    </script>
</body>
</html>
