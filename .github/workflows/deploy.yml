name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /root/ListMonk-Pro
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            for i in $(seq 1 15); do
              if curl -fs http://localhost:8000/auth/login > /dev/null; then
                echo "ListMonk Pro is healthy!"
                break
              fi
              echo "Waiting for ListMonk Pro to respond ($i/15)..."
              sleep 2
            done
            curl -fs http://localhost:8000/auth/login > /dev/null || (echo "Deploy health check failed!" && exit 1)

