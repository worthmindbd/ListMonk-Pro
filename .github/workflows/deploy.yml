name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        run: pytest tests/ -q

  deploy:
    runs-on: ubuntu-latest
    # Never ship to the VPS without the suite passing (AGENTS.md: always run
    # the full test suite before committing — the gate makes that enforceable).
    needs: test
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          # Space-separated ListMonk Pro checkout directories on the VPS, set
          # as the repository variable DEPLOY_PATHS (Settings → Secrets and
          # variables → Actions → Variables). Unset = the single default install.
          DEPLOY_PATHS: ${{ vars.DEPLOY_PATHS || '/root/ListMonk-Pro' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_PATHS
          # Each checkout carries its own .env (port, container name,
          # credentials); deploy.sh reads it, so this step knows nothing about
          # the server beyond the list of directories. One failing instance
          # does not stop the others, but fails the job.
          script: |
            set -euo pipefail
            failed=0
            for dir in $DEPLOY_PATHS; do
              echo "== $dir"
              if ( cd "$dir" \
                   && git fetch origin main \
                   && git reset --hard origin/main \
                   && bash ./deploy.sh ); then
                :
              else
                echo "Deploy failed for $dir"
                failed=1
              fi
            done
            exit "$failed"

